name: Publish Homebrew formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable release tag to publish (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-homebrew-formula
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Publish Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: ./scripts/update-homebrew-formula.sh "$VERSION"
