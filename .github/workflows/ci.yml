name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # gitx and wt shell out to git, and the test repos need an identity.
      - name: Configure git
        run: |
          git config --global user.email "ci@example.test"
          git config --global user.name "ci"
          git config --global init.defaultBranch main

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files" >&2
            exit 1
          fi
      - run: go vet ./...

      # -race needs a C toolchain; it is guaranteed on the Linux/macOS runners.
      - name: Test (race)
        if: runner.os != 'Windows'
        run: go test -race ./...
      # The broad suite remains advisory on Windows while unrelated domain
      # packages finish guarding POSIX-only assumptions. SSH/fleet behavior has
      # a separate required native gate below.
      - name: Test (broad Windows advisory)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: go test ./...

      - run: go build ./cmd/dev

      # The skill documents the CLI; drift between them is a bug.
      - run: go run ./cmd/dev skill sync --check

      - name: Test packaging helpers
        if: runner.os == 'Linux'
        run: ./scripts/update-homebrew-formula_test.sh

      # e2e.sh is a POSIX shell lifecycle script.
      - name: End-to-end
        if: runner.os != 'Windows'
        run: ./scripts/e2e.sh

  windows-ssh-required:
    name: Windows SSH required
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Configure git
        run: |
          git config --global user.email "ci@example.test"
          git config --global user.name "ci"
          git config --global init.defaultBranch main

      - name: Test SSH host domain natively
        run: go test ./internal/sshhost
      - name: Test fleet transport and managed config natively
        run: go test ./internal/fleet
      - name: Test SSH and fleet CLI contracts natively
        run: go test ./internal/cli -run 'SSH|Fleet|Doctor'

      - name: Compile affected packages and tests for windows/arm64
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "arm64"
          go test -c -o "$env:RUNNER_TEMP\sshhost-arm64.test.exe" ./internal/sshhost
          go test -c -o "$env:RUNNER_TEMP\fleet-arm64.test.exe" ./internal/fleet
          go test -c -o "$env:RUNNER_TEMP\cli-arm64.test.exe" ./internal/cli
          go build -o "$env:RUNNER_TEMP\dev-arm64.exe" ./cmd/dev
