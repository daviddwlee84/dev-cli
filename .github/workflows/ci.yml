name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # gitx and wt shell out to git, and the test repos need an identity.
      - name: Configure git
        run: |
          git config --global user.email "ci@example.test"
          git config --global user.name "ci"
          git config --global init.defaultBranch main

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files" >&2
            exit 1
          fi
      - run: go vet ./...

      # -race needs a C toolchain; it is guaranteed on the Linux/macOS runners.
      - name: Test (race)
        if: runner.os != 'Windows'
        run: go test -race ./...
      # Windows is a supported build target; the domain test suites still assume
      # a POSIX filesystem in places, so this run is advisory until each is
      # guarded. Compilation, vet and the build below are hard requirements.
      - name: Test
        if: runner.os == 'Windows'
        continue-on-error: true
        run: go test ./...

      - run: go build ./cmd/dev

      # The skill documents the CLI; drift between them is a bug.
      - run: go run ./cmd/dev skill sync --check

      - name: Test packaging helpers
        if: runner.os == 'Linux'
        run: ./scripts/update-homebrew-formula_test.sh

      # e2e.sh is a POSIX shell lifecycle script.
      - name: End-to-end
        if: runner.os != 'Windows'
        run: ./scripts/e2e.sh
