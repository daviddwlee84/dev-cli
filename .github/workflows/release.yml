name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate stable release tag
        shell: bash
        run: |
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Build tagged version
        run: |
          make build
          test "$(./dev --version)" = "dev version $VERSION"

      - name: Verify independent source and Go module packages
        run: python3 scripts/check-distribution.py --version "$VERSION"

      # modernc.org/sqlite is pure Go, so every target cross-compiles from one
      # runner with CGO disabled and ships as a static binary. Windows ships a
      # .zip with dev.exe; every other platform a .tar.gz with dev.
      - name: Build release archives
        run: |
          mkdir -p dist
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          ldflags="-s -w -X github.com/daviddwlee84/dev-cli/internal/cli.Version=$VERSION"
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            bin=dev; [ "$os" = windows ] && bin=dev.exe
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -ldflags "$ldflags" -o "dist/$bin" ./cmd/dev
            touch -d "@$SOURCE_DATE_EPOCH" "dist/$bin"
            if [ "$os" = windows ]; then
              ( cd dist && TZ=UTC zip -X -q "dev-cli_${VERSION}_${os}_${arch}.zip" "$bin" )
            else
              tar --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner -cf - -C dist "$bin" | gzip -n > "dist/dev-cli_${VERSION}_${os}_${arch}.tar.gz"
            fi
            rm "dist/$bin"
          done
          # git archive honors export-ignore, keeping conversation history out
          # of the source package used for native upgrades (e.g. Termux).
          git archive --format=tar.gz --output="dist/dev-cli_${VERSION}_source.tar.gz" "$GITHUB_SHA"
          ( cd dist && sha256sum -- *.tar.gz *.zip > SHA256SUMS )
          ls -l dist

      # The changelog is the account a human wrote; generated notes are the
      # fallback for a tag whose section is missing.
      - name: Extract release notes
        run: |
          awk -v ver="${VERSION#v}" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "no CHANGELOG section for $VERSION; falling back to generated notes"
            rm -f notes.md
          fi

      - name: Render the verified Scoop asset
        run: |
          ./scripts/update-scoop-manifest.sh "$VERSION" dist/SHA256SUMS --render-only
          cp packaging/scoop/dev-cli.json dist/dev-cli.json
      - name: Verify actual source and binary payloads
        run: |
          python3 scripts/check-distribution.py --version "$VERSION" --source-archive "dist/dev-cli_${VERSION}_source.tar.gz"
          python3 scripts/release.py check --project dev-cli --tag "$VERSION" --smoke
      - name: Publish a complete verified draft without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish --project dev-cli --tag "$VERSION" --repo "$GITHUB_REPOSITORY" --notes notes.md

      # Homebrew formulas are synchronized by daviddwlee84/homebrew-tap.
      # This repository publishes immutable assets; it never writes the tap.

      # Refresh the in-repo Scoop manifest from the built checksums and, when a
      # bucket token is configured, push it to the bucket repo. Never fail the
      # release over a packaging problem.
      - name: Update Scoop manifest
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: ./scripts/update-scoop-manifest.sh "$VERSION" dist/SHA256SUMS --bucket-only
