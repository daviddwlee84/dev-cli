name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate stable release tag
        shell: bash
        run: |
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Build tagged version
        run: |
          make build
          test "$(./dev --version)" = "dev version $VERSION"

      # modernc.org/sqlite is pure Go, so every target cross-compiles from one
      # runner with CGO disabled and ships as a static binary. Windows ships a
      # .zip with dev.exe; every other platform a .tar.gz with dev.
      - name: Build release archives
        run: |
          mkdir -p dist
          ldflags="-s -w -X github.com/daviddwlee84/dev-cli/internal/cli.Version=$VERSION"
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            bin=dev; [ "$os" = windows ] && bin=dev.exe
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -ldflags "$ldflags" -o "dist/$bin" ./cmd/dev
            if [ "$os" = windows ]; then
              ( cd dist && zip -q "dev-cli_${VERSION}_${os}_${arch}.zip" "$bin" )
            else
              tar -czf "dist/dev-cli_${VERSION}_${os}_${arch}.tar.gz" -C dist "$bin"
            fi
            rm "dist/$bin"
          done
          ( cd dist && sha256sum -- *.tar.gz *.zip > SHA256SUMS )
          ls -l dist

      # The changelog is the account a human wrote; generated notes are the
      # fallback for a tag whose section is missing.
      - name: Extract release notes
        run: |
          awk -v ver="${VERSION#v}" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "no CHANGELOG section for $VERSION; falling back to generated notes"
            rm -f notes.md
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists"
            exit 0
          fi
          if [ -s notes.md ]; then
            gh release create "$VERSION" --verify-tag --notes-file notes.md --title "$VERSION"
          else
            gh release create "$VERSION" --verify-tag --generate-notes --title "$VERSION"
          fi
          gh release upload "$VERSION" dist/*.tar.gz dist/*.zip dist/SHA256SUMS

      # Homebrew owns its Cellar binary, so releases advance the tap rather
      # than asking `dev upgrade` to overwrite a package-managed file. This is
      # a required distribution path: a configured token failure fails the job
      # and a rerun can safely retry an already-created GitHub release.
      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: ./scripts/update-homebrew-formula.sh "$VERSION"

      # Refresh the in-repo Scoop manifest from the built checksums and, when a
      # bucket token is configured, push it to the bucket repo. Never fail the
      # release over a packaging problem.
      - name: Update Scoop manifest
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: ./scripts/update-scoop-manifest.sh "$VERSION" dist/SHA256SUMS
